[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-arch-public-demo"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "React/FastAPI document assistant source showcase with a separate offline demo"
requires-python = ">=3.12"
dependencies = [
  "langchain-core>=1.6,<2",
  "langchain-openai>=1.6,<2",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "numpy>=2.5,<3",
  "python-dotenv>=1.2,<2",
  "pydantic>=2.13,<3",
  "PyMuPDF>=1.28,<2",
  "Pillow>=12.3,<13",
  "fastapi>=0.141,<1",
  "uvicorn>=0.53,<1",
]

[project.optional-dependencies]
demo = ["streamlit>=1.63,<2"]

[project.scripts]
rag-arch-demo = "demo.__main__:main"

[tool.setuptools]
packages = ["demo", "rag_arch", "rag_arch.web"]

[tool.unittest]
start-directory = "tests"