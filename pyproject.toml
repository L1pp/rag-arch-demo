[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-arch-public-demo"
version = "0.1.0"
description = "Offline-first public demonstration of a document retrieval and review workflow"
requires-python = ">=3.12"
dependencies = [
  "langchain-core>=1.6,<2",
  "langchain-openai>=1.6,<2",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "numpy>=2.5,<3",
  "python-dotenv>=1.2,<2",
  "pydantic>=2.13,<3",
  "PyMuPDF>=1.28,<2",
  "Pillow>=12.3,<13",
  "streamlit>=1.63,<2",
]

[project.scripts]
rag-arch-demo = "demo.__main__:main"

[tool.setuptools]
packages = ["demo", "rag_arch"]

[tool.unittest]
start-directory = "tests"