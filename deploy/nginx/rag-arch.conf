# Include this file inside the Nginx http {} context (commonly conf.d/*.conf).
# Replace rag-arch-demo.example.com, the static root, certificate paths, and login rate
# after review. This example assumes Nginx is the only public ingress.

limit_req_zone $binary_remote_addr zone=rag_login_by_ip:10m rate=10r/m;
limit_req_status 429;
server_tokens off;

upstream rag_arch_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name rag-arch-demo.example.com;
    return 301 https://rag-arch-demo.example.com$request_uri;
}

# Unknown TLS SNI/Host is rejected. ssl_reject_handshake requires a recent Nginx;
# on older releases provide a reviewed fallback certificate and return 444.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rag-arch-demo.example.com;

    ssl_certificate     /etc/letsencrypt/live/rag-arch-demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag-arch-demo.example.com/privkey.pem;

    root /srv/www/rag-arch-demo;
    index index.html;
    client_max_body_size 12m;
    client_body_timeout 60s;

    # Nginx's per-IP limiter runs for every request to the login endpoint,
    # including successful logins. Tune rate/burst with the operator; consider
    # shared-NAT users before lowering it. The app's PostgreSQL limiter remains
    # an independent second layer.
    location = /api/auth/login {
        limit_req zone=rag_login_by_ip burst=5 nodelay;

        proxy_pass http://rag_arch_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Override the incoming header. Do not preserve client-supplied XFF here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }

    # Keep SSE responses streaming through the proxy. The app emits event
    # updates from PostgreSQL and periodic keep-alives; do not buffer/cache them.
    location ^~ /api/ {
        proxy_pass http://rag_arch_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_next_upstream off;
    }
    location = /api {
        return 404;
    }

    # This fixed read-only snapshot is four public files. Missing files must be
    # a real 404, never the React index document.
    location = /viewer/history {
        return 301 /viewer/history/;
    }
    location ^~ /viewer/history/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # React Router paths such as /login and /viewer/pages use browser history.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
