name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          # Disposable test service only; deployment uses its own credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rag_arch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_arch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/rag_arch_test
      RAG_ARCH_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/rag_arch_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create project Python environment
        run: |
          python -m venv .venv-web
          echo "$GITHUB_WORKSPACE/.venv-web/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-web.txt -e .

      - name: Check Python dependencies
        run: python -m pip check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Check generated API types
        working-directory: frontend
        run: npm run check:api

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test backend
        run: python -m unittest discover tests

      - name: Scan tracked public files
        run: python scripts/verify_public_tree.py --tracked
